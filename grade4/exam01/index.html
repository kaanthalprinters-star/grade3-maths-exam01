function get(){let raw=localStorage.getItem(key);if(!raw)return null;let s=JSON.parse(raw);if(!Array.isArray(s.answers)||s.answers.length!==paper.length||!Number.isFinite(s.end)||s.pos<0||s.pos>=paper.length||!Number.isInteger(s.pos))throw Error();return s}
function save(s){localStorage.setItem(key,JSON.stringify(s))}
function clock(ms){let t=Math.ceil(Math.max(ms,0)/1000);return Math.floor(t/60)+' நிமி '+String(t%60).padStart(2,'0')+' செ.'}
function teacherReport(s, correct, wrong, blank) {

    '👤 மாணவர் பெயர்: ' + s.name,

    '📅 திகதி: ' + date.format(s.start),
    '📝 பரீட்சை இலக்கம்: ' + num,
    '📖 பாடம்: ' + title,
    '🏆 பெற்ற புள்ளிகள்: ' + s.score + '/100',
    '📊 சதவீதம்: ' + s.score + '%',
    '✅ சரியான விடைகள்: ' + correct,
    '❌ தவறான விடைகள்: ' + wrong,
    '⏳ விடையளிக்காத வினாக்கள்: ' + blank,
    '🕒 ஆரம்பித்த நேரம்: ' + time.format(s.start),
    '🕒 நிறைவடைந்த நேரம்: ' + time.format(s.finish),
    '⏱️ எடுத்துக்கொண்ட நேரம்: ' + minutes + (minutes===1?' நிமிடம் ':' நிமிடங்கள் ') + remainder + (remainder===1?' செக்கன்':' செக்கன்கள்'),
    '⭐ மதிப்பீடு: ' + rating,
    'தயாரிப்பு: சதா. சுதன்',
    'ஆரம்பக் கல்வி ஆசிரியர்'
  ].filter(Boolean);
}
function finish(s){if(s.status==='COMPLETED')return;let count=s.answers.filter((x,i)=>x===paper[i].a).length;s.status='COMPLETED';s.finish=Math.min(Date.now(),s.end);s.score=Math.round(count*1000/paper.length)/10;save(s)}

app.querySelector('form').onsubmit=e=>{e.preventDefault();if(get()||!openNow())return paint();let name=app.querySelector('#name').value.trim();if(!name){document.querySelector('#msg').textContent='தயவுசெய்து உனது பெயரை எழுதுக.';return}let start=Date.now();save({name,school:document.querySelector('#school').value.trim(),start,end:start+1800000,answers:Array(paper.length).fill(null),pos:0,status:'IN_PROGRESS',version:1});paint()};return}
if(s.status==='COMPLETED'){let ok=s.answers.filter((x,i)=>x===paper[i].a).length,blank=s.answers.filter(x=>x===null).length,wrong=paper.length-ok-blank;let report=teacherReport(s,ok,wrong,blank);app.innerHTML='<h2>🎉 பரீட்சை நிறைவடைந்தது!</h2><a class="send" href="https://wa.me/94752080314?text='+encodeURIComponent(report.join('\n'))+'">💬 ஆசிரியருக்கு அனுப்பவும்</a><p>'+report.slice(1).map(escape).join('<br>')+'</p><details><summary>விடைகளைப் பார்ப்போம்</summary>'+paper.map((p,i)=>'<article><strong>'+ (i+1)+'. '+p.q+'</strong>'+p.v+'உனது விடை: '+(s.answers[i]??'விடையளிக்கவில்லை')+'<br>சரியான விடை: '+p.a+'<br>'+p.why+'</article>').join('')+'</details><button class="start" id="retry">பரீட்சையை மீண்டும் ஆரம்பிக்கவும்</button><p id="retryNote" role="status"></p>';
const retry = document.querySelector('#retry');
const note = document.querySelector('#retryNote');

  retry.disabled = true;
  note.textContent = 'மீண்டும் எழுதுவதற்கான காலம் நிறைவடைந்துள்ளது. ஆசிரியரைத் தொடர்புகொள்ளவும்.';

if (!openNow()) showClosed();
retry.onclick = () => {

return}
let i=s.pos,p=paper[i];app.innerHTML='<small>'+escape(s.name)+' · பரீட்சை '+num+'</small><p>வினா '+String(i+1).padStart(2,'0')+' / 30　<span id="timer">'+clock(s.end-Date.now())+'</span></p><progress max="30" value="'+s.answers.filter(x=>x!==null).length+'"></progress><h2>'+p.q+'</h2>'+p.v+'<div class="opts"></div><div class="nav"><button id="back" '+(i===0?'disabled':'')+'>முன்னைய வினா</button><button id="done">பரீட்சையை முடிக்கவும்</button></div>';for(let val of p.opts){let el=document.createElement('button');el.textContent=val;if(s.answers[i]===val)el.className='sel';app.querySelector('.opts').append(el);el.onclick=()=>{if(busy)return;let t=get();if(t.status!=='IN_PROGRESS'||t.pos!==i||Date.now()>=t.end)return paint();busy=true;t.answers[i]=val;t.pos=Math.min(paper.length-1,i+1);save(t);app.querySelectorAll('button').forEach(b=>b.disabled=true);el.className='sel';delay=setTimeout(paint,280)}}
