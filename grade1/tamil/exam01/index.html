function valid(s){return s&&s.version===VERSION&&s.exam===EXAM_ID&&s.release===RELEASE_ID&&typeof s.name==="string"&&s.name.trim()&&typeof s.school==="string"&&Number.isFinite(s.start)&&s.start>=OPEN&&s.start<CLOSE&&s.deadline===s.start+EXAM_DURATION_MS&&Number.isInteger(s.current)&&s.current>=0&&s.current<20&&Array.isArray(s.answers)&&s.answers.length===20&&s.answers.every((a,i)=>a===null||Number.isInteger(a)&&a>=0&&a<Q[i].options.length)&&["IN_PROGRESS","COMPLETED"].includes(s.status)&&(s.status!=="COMPLETED"||Number.isFinite(s.finish)&&s.finish>=s.start&&s.finish<=s.deadline)}

document.getElementById("registration").onsubmit=e=>{e.preventDefault();let name=document.getElementById("student").value.trim(),school=document.getElementById("school").value.trim();if(!name){let er=document.getElementById("error");er.hidden=false;er.textContent="தயவுசெய்து உனது பெயரை எழுதுக.";document.getElementById("student").focus();return}if(!sync())return;if(session){route();return}let now=Date.now();if(linkStatus(now)!=="open"){closed(linkStatus(now));return}session={version:VERSION,exam:EXAM_ID,release:RELEASE_ID,name,school,start:now,deadline:now+EXAM_DURATION_MS,current:0,answers:Array(20).fill(null),status:"IN_PROGRESS",finish:null,result:null};if(save())route()}}
function renderQuestion(){clearInterval(timer);if(!session||session.status!=="IN_PROGRESS")return;if(Date.now()>=session.deadline){finish(session.deadline);return}busy=false;let i=session.current,q=Q[i],done=session.answers.filter(a=>a!==null).length;app.innerHTML='<div class="meta"><span>'+esc(session.name)+' · பரீட்சை 01</span><span class="timer" id="clock" role="timer">'+formatTime(session.deadline-Date.now())+'</span></div><div class="meta"><span>வினா '+pad(i+1)+' / 20</span><span>'+done+' / 20</span></div><div class="progress" role="progressbar" aria-label="முன்னேற்றம்" aria-valuemin="0" aria-valuemax="20" aria-valuenow="'+done+'"><div style="width:'+(done*5)+'%"></div></div><div class="question">'+esc(q.prompt)+'</div>'+visuals(q.visual)+'<div class="options">'+q.options.map((k,j)=>'<button class="option '+(session.answers[i]===j?"selected":"")+'" data-option="'+j+'" aria-label="'+["அ","ஆ","இ"][j]+": "+esc(ART[k][0])+'">'+art(k)+'<span>'+["அ","ஆ","இ"][j]+'</span></button>').join("")+'</div><div class="nav"><button id="prev" class="sub" '+(i===0?"disabled":"")+'>‹ முன்னைய வினா</button><button id="end" class="sub">பரீட்சையை முடிக்கவும்</button></div><div id="confirm" hidden class="notice"><p id="confirmtext"></p><div class="nav"><button id="cancel" class="sub">தொடர்க</button><button id="confirmend" class="sub">முடிக்கவும்</button></div></div>';
app.querySelectorAll("[data-option]").forEach(b=>b.onclick=()=>choose(i,Number(b.dataset.option)));document.getElementById("prev").onclick=()=>{if(busy||!sync()||session.status!=="IN_PROGRESS")return;session.current=Math.max(0,session.current-1);if(save())renderQuestion()};document.getElementById("end").onclick=()=>{if(busy)return;document.getElementById("confirmtext").textContent=(20-done)+" வினாக்களுக்கு விடையளிக்கவில்லை. பரீட்சையை முடிக்க விரும்புகிறாயா?";document.getElementById("confirm").hidden=false};document.getElementById("cancel").onclick=()=>document.getElementById("confirm").hidden=true;document.getElementById("confirmend").onclick=()=>finish();timer=setInterval(tick,250)}
function choose(i,j){if(busy||!sync()||!session||session.status!=="IN_PROGRESS"||session.current!==i)return;if(Date.now()>=session.deadline){finish(session.deadline);return}busy=true;session.answers[i]=j;let next=session.answers.findIndex((a,k)=>k>i&&a===null);if(next<0)next=session.answers.findIndex(a=>a===null);if(i<19&&session.answers[i+1]!==null&&next>=0)next=i+1;if(next>=0)session.current=next;if(!save())return;app.querySelectorAll("[data-option]").forEach(b=>{b.disabled=true;b.classList.toggle("selected",Number(b.dataset.option)===j)});advance=setTimeout(()=>{if(!sync())return;if(session.status==="COMPLETED"){renderResult();return}if(session.answers.every(a=>a!==null))finish();else renderQuestion()},300)}
function message(s){let r=score(s.answers),v=rating(r.points);return ["📚 அறிவுச் சிறகுகள்","தரம் 1 – தமிழ்ப் பரீட்சைப் பெறுபேறு","👤 மாணவர் பெயர்: "+s.name,...(s.school?["🏫 பாடசாலை: "+s.school]:[]),"📅 திகதி: "+stamp(s.start,true),"📝 பரீட்சை இலக்கம்: 01","📖 பாடம்: தமிழ்","📚 பாடத்தலைப்பு: "+TOPIC,"🏆 பெற்ற புள்ளிகள்: "+r.points+"/100","📊 சதவீதம்: "+r.points+"%","✅ சரியான விடைகள்: "+r.correct,"❌ தவறான விடைகள்: "+r.wrong,"⏳ விடையளிக்காத வினாக்கள்: "+r.unanswered,"🕒 ஆரம்பித்த நேரம்: "+stamp(s.start),"🕒 நிறைவடைந்த நேரம்: "+stamp(s.finish),"⏱️ எடுத்துக்கொண்ட நேரம்: "+duration(elapsed(s)),"⭐ மதிப்பீடு: "+"⭐".repeat(v[0])+" "+v[1],"தயாரிப்பு: சதா. சுதன்","ஆரம்பக் கல்வி ஆசிரியர்"].join("\n")}
function renderResult(){clearInterval(timer);clearTimeout(advance);busy=false;let s=session,r=score(s.answers),v=rating(r.points);app.innerHTML='<div class="center"><h2>🎉 பரீட்சை நிறைவடைந்தது!</h2></div><a class="btn wa" id="share" target="_blank" rel="noopener">💬 ஆசிரியருக்கு அனுப்பவும்</a><div class="center"><h3>'+esc(s.name)+'</h3>'+(s.school?'<p>பாடசாலை: '+esc(s.school)+'</p>':'')+'<p>பரீட்சை 01 · '+TOPIC+'</p><div class="ring" style="--score:'+r.points+'%"><div><b>'+r.points+'</b><small>/100 புள்ளிகள்</small></div></div><p>சதவீதம்: '+r.points+'%</p><div class="stars" aria-label="'+v[0]+' நட்சத்திரங்கள்">'+"⭐".repeat(v[0])+'</div><h3>'+v[1]+'</h3><p>எடுத்துக்கொண்ட நேரம்: '+duration(elapsed(s))+'</p></div><div class="stats"><div class="stat"><strong class="ok">'+r.correct+'</strong>சரியான விடைகள்</div><div class="stat"><strong class="bad">'+r.wrong+'</strong>தவறான விடைகள்</div><div class="stat"><strong>'+r.unanswered+'</strong>விடையளிக்காதவை</div></div><details id="review"><summary>விடைகளைப் பார்வையிடுக</summary><div id="answers"></div></details>';document.getElementById("share").href=WA+"?text="+encodeURIComponent(message(s));document.getElementById("review").addEventListener("toggle",()=>{let a=document.getElementById("answers");if(a.innerHTML)return;a.innerHTML=Q.map((q,i)=>{let choice=s.answers[i],correct=choice===q.correct;return '<article class="review"><b>வினா '+pad(i+1)+'</b><p>'+esc(q.prompt)+'</p>'+visuals(q.visual)+'<div class="answer">விடைத் தெரிவுகள்: '+q.options.map(art).join("")+'</div><p class="'+(correct?"ok":"bad")+'">'+(choice===null?"விடையளிக்கவில்லை":correct?"சரி":"தவறு")+'</p><div class="answer">உனது விடை: '+(choice===null?"—":art(q.options[choice])+esc(ART[q.options[choice]][0]))+'</div><div class="answer">சரியான விடை: '+art(q.options[q.correct])+esc(ART[q.options[q.correct]][0])+'</div><p>'+esc(q.explanation)+'</p></article>'}).join("")})}
function route(){clearInterval(timer);clearTimeout(advance);busy=false;if(!storageOK){home();return}if(!session){home();return}if(session.status==="COMPLETED"){renderResult();return}if(Date.now()>=session.deadline||session.answers.every(a=>a!==null)){finish(session.deadline<=Date.now()?session.deadline:Date.now());return}renderQuestion()}
window.addEventListener("storage",e=>{if(e.key===KEY||e.key===null){session=load();route()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){session=load();route()}});
window.addEventListener("pageshow",e=>{if(e.persisted){session=load();route()}});
session=load();
if(navigator.locks&&navigator.locks.request){navigator.locks.request(KEY,{ifAvailable:true},async lock=>{if(!lock){activeTab=false;app.innerHTML='<h2>பரீட்சை வேறொரு திரையில் திறந்துள்ளது.</h2><p>அந்தத் திரையை மூடிவிட்டு இப்பக்கத்தைப் புதுப்பிக்கவும்.</p>';return}route();await new Promise(resolve=>{lockRelease=resolve})}).catch(()=>route())}else route();
</script></body></html>
