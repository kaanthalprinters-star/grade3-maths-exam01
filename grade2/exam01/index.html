function counts(){let correct=0,wrong=0,blank=0;s.answers.forEach((a,i)=>{if(a===null)blank++;else if(a===Q[i][2])correct++;else wrong++});return {correct,wrong,blank,score:correct*5}}

function choose(i,j){if(locked||!s||s.status!=='IN_PROGRESS'||s.index!==i)return;if(Date.now()>=s.deadline){finish(s.deadline);return}locked=true;const token=++navToken;s.answers[i]=j;const next=i<19?i+1:s.answers.findIndex(a=>a===null);if(next>=0)s.index=next;save();root.querySelectorAll('.option').forEach((b,k)=>{b.disabled=true;b.classList.toggle('selected',j===k)});setTimeout(()=>{if(token!==navToken||!s||s.status!=='IN_PROGRESS')return;locked=false;if(Date.now()>=s.deadline){finish(s.deadline);return}if(counts().blank===0){finish();return}question();window.scrollTo(0,0)},300)}
